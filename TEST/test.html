<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            background-color: rgb(12, 12, 12);
        }
        #container{
            position: relative;
            width: 250px;
            height: 400px;
            background-color: azure;
            border-radius: 10px;
        }
        #box{
            position: absolute;
            width : 55px;
            height : 55px;
            border-radius : 50%;
            background-color: blue;
            top : -10px;
            right : -10px;
        }
    </style>
    <title>Document</title>
</head>
<body>
    <div id="container">
        <div id="box">

        </div>
    </div>
</body>
</html>
